; =============================================================================
;  MeteoPlaneRadar - PlatformIO project configuration
;
;  Board:  Waveshare ESP32-S3-Touch-LCD-2.1
;          ESP32-S3R8 (8 MB OPI PSRAM, 16 MB QIO flash), round 480x480 ST7701.
;
;  This mirrors the arduino-cli profile in sketch.yaml:
;    fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=custom,
;          CDCOnBoot=cdc,FlashMode=qio
;    core: esp32:esp32 3.0.7
;
;  Build / upload / monitor:
;    pio run                 # compile
;    pio run -t upload       # flash firmware
;    pio run -t monitor      # serial monitor (115200)
;    pio run -t uploadfs     # flash the SPIFFS filesystem (if used)
; =============================================================================

[platformio]
; The sketch/source files live in src/ (already the Arduino layout).
src_dir = src

[env:esp32-s3-meteoplaneradar]
; The official PlatformIO "espressif32" platform still ships Arduino-ESP32 2.x.
; This project needs core 3.0.7, so we use the community "pioarduino" fork,
; whose 51.03.07 release bundles exactly Arduino-ESP32 3.0.7.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board    = esp32-s3-devkitc-1
framework = arduino

; --- Chip / memory layout (matches the FQBN options) -------------------------
board_build.mcu           = esp32s3
board_build.flash_mode    = qio          ; FlashMode=qio
board_build.arduino.memory_type = qio_opi ; QIO flash + OPI (octal) PSRAM
board_upload.flash_size   = 16MB         ; FlashSize=16M
board_upload.maximum_size = 16777216
board_build.partitions    = src/partitions.csv  ; PartitionScheme=custom
board_build.filesystem    = spiffs

; --- USB CDC on boot (CDCOnBoot=cdc, native ESP32-S3 USB) ---------------------
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; ElegantOTA in synchronous WebServer mode (matches OTA.cpp) - keeps the
  ; async stack out of the build entirely.
  -DELEGANTOTA_USE_ASYNC_WEBSERVER=0

; --- Serial monitor ----------------------------------------------------------
monitor_speed  = 115200
monitor_filters = esp32_exception_decoder, default

; --- Libraries (pinned to the same versions as sketch.yaml) ------------------
; ElegantOTA is used in its DEFAULT synchronous WebServer mode (see OTA.cpp),
; so the code never includes ESPAsyncWebServer/AsyncTCP. ElegantOTA still
; declares them as dependencies, so PlatformIO installs them transitively
; (mathieucarbou/esp32async fork) - they are not listed explicitly here because
; the exact sketch.yaml versions (3.3.12 / 3.2.10) are Arduino-LibraryManager
; numbers that do not exist in the PlatformIO registry.
lib_ldf_mode = chain+
; ElegantOTA declares ESPAsyncWebServer/AsyncTCP as dependencies, so PlatformIO
; pulls them in - but in sync mode the code never includes them, and the fork's
; latest AsyncTCP needs core 3.1+ (NetworkInterface.h). Ignore them so they are
; neither compiled nor linked.
lib_ignore =
  AsyncTCP
  ESPAsyncWebServer
lib_deps =
  moononournation/GFX Library for Arduino@1.4.9
  bitbank2/PNGdec@1.0.1
  bblanchon/ArduinoJson@7.1.0
  tzapu/WiFiManager@2.0.17
  ayushsharma82/ElegantOTA@3.1.6
